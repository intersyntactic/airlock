name: is_airlock
description: >-
  An Airlock that decides and records runs under is_airlock_api, witnessing
  every arrival before anything reads it, by sending each to is_logbook's
  one writer service.
version: 0.1.0
repository: https://github.com/intersyntactic/airlock

environment:
  sdk: ^3.13.0

dependencies:
  is_airlock_api: ^0.9.0
  is_effects: ^0.7.0
  is_flight_rules: ^0.1.0
  is_logbook: ^0.2.0
  checked_json: ^0.2.1
  is_logbook_client: ^0.2.0
  is_web_driver:
    git:
      url: https://github.com/intersyntactic/web_driver.git
      ref: 90f9e623baaf148badd23099c9af972b83753820
  is_docking_station:
    git:
      url: https://github.com/intersyntactic/docking_station.git
      ref: 8b7a886582b0149d4cf79b1c5d782a0fb8a6a685
      # PR #23 (https://github.com/intersyntactic/docking_station/pull/23),
      # not merged yet: the is_logbook 0.2.0 move, confirmed stable by
      # docking-station-cc (same code the live docking station runs).
      # Repin to main's sha once Nick merges it.
  is_claude_code_driver:
    git:
      url: https://github.com/intersyntactic/claude_code_driver.git
      ref: c8c9ae1

dev_dependencies:
  analyzer: ^14.7.0
  is_shapes: ^0.5.0
  lints: ^6.1.0
  test: ^1.25.0

# The whole dependency chain (is_effects, is_airlock_api, is_logbook) is
# hosted now, so this package could publish. publish_to: none until Nick
# says go — nothing here has asked for that yet.
publish_to: none
