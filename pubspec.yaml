name: is_airlock
description: >-
  An Airlock that decides and records runs under is_airlock_api, witnessing
  every arrival before anything reads it, by sending each to is_logbook's
  one writer service.
version: 0.7.0
repository: https://github.com/intersyntactic/airlock

environment:
  sdk: ^3.13.0

dependencies:
  async: ^2.13.1
  is_airlock_api: ^0.26.0
  is_flight_rules: ^0.12.0
  checked_json: ^0.4.0
  is_logbook_client: ^0.4.0
  is_docking_station_api: ^0.11.0
  is_conversation_vocabulary: ^0.2.0
  is_model_vocabulary: ^0.5.0
  is_sign_in_vocabulary: ^0.1.2
  is_web_address_vocabulary: ^0.1.1
  is_unix_socket_user_check: ^0.2.1
  is_outcome_vocabulary: ^0.1.0
  is_relative_path_vocabulary: ^0.1.0
  is_file_request_vocabulary: ^0.1.0
  is_program_request_vocabulary: ^0.1.0
  is_web_request_vocabulary: ^0.1.0

dev_dependencies:
  analyzer: ^14.7.0
  # Only to start a real LogbookService in tests (logbook_service_harness.dart)
  # — never imported by lib/ or bin/, which depend on is_logbook_client alone.
  is_logbook: ^0.5.0
  is_shapes: ^0.6.0
  lints: ^6.1.0
  test: ^1.25.0
  yaml: ^3.1.2

# The whole dependency chain (is_airlock_api, is_logbook) is hosted now,
# so this package could publish. publish_to: none until Nick says go —
# nothing here has asked for that yet.
publish_to: none
