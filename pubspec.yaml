name: is_airlock
description: >-
  An Airlock that decides and records runs under is_airlock_api, witnessing
  every arrival into an add-only journal before anything reads it.
version: 0.1.0
repository: https://github.com/intersyntactic/airlock

environment:
  sdk: ^3.13.0

dependencies:
  is_airlock_api:
    git:
      url: https://github.com/intersyntactic/airlock_api.git
      ref: 4de52a9eb0f39dc0358762b8ba583505e6cef69a
  is_effects: ^0.1.0
  is_journal: ^0.3.0
  checked_json: ^0.2.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.25.0

# is_airlock_api 0.2.0 is unpublished (git-pinned above), so this package
# cannot publish to pub.dev until it is: pub refuses a publishable package
# with a git dependency. `publish_to: none` until that pin becomes a
# version; teams-module-e2 git-pins this repo at the ref this package
# hands intersyntactic-a8.
publish_to: none
